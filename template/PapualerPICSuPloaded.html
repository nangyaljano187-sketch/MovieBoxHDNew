<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uploaded page</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        color: white;
      }

      .form_designe {
        /* background-color: rgb(8, 247, 175); */
        background-color: brown;
        background-size: cover;
        padding: 22px;
        font-size: 21px;
        width: 100%;
        border-radius: 11px;
      }

      .container {
        /* border: 3px solid brown; */
        /* display: flex;
        flex-wrap: nowrap; */
        padding: 20px;
      }

      .same {
        height: 25px;
        width: 100%;
        color: black;

      }

      .btn {
        padding: 12px;
        border-radius: 6px;
        width: 100%;
        background-color: blue;
        color: white;
        cursor: pointer;
      }

      body {
        background-color: black;
      }

      /* show Papular image */
      .container_P_show {
        background-color: green;
        display: flex;
        padding: 7px;
        width: 100%;
        margin-top: 6px;
      }

      .PImageShoW {
        background-color: blue;
        width: 100%;
      }

      .picdiv {
        width: 10%;
      }

      .same2 {
        margin-left: 30px;
        width: 6%;
      }

      .btn_delete {
        padding: 8px;
        background-color: red;
      }

      .navbar_container {
        width: 100%;
        background-color: blue;
        padding: 12px;
      }

      .a_same {
        margin-left: 17px;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <header class="navbar_container">
      <a href="{% url 'uploaded_page' %}" class="a_same">PapularMovies</a>
      <a href="{% url 'Database_save_movies_catogri' %}" class="a_same">Movie_catogri</a>
      <a href="{% url 'db_save_DMovies' %}" class="a_same">Movies</a><br><br>
      <a href="{% url 'Papular_Videos_uploaded' %}" class="a_same">PapularVideos</a>
      <a href="{% url 'Papular_Videos_categori' %}" class="a_same">Videos_categori</a>
      <a href="{% url 'VIDEOS_PANEL_UPLOADED' %}" class="a_same">Videos</a><br><br>
      <a href="{% url 'Papular_picture_uploaded' %}" class="a_same">Papular_picturs</a>
      <a href="{% url 'Papular_pics_categori_uploaded' %}" class="a_same">Pics_catogri</a>
      <a href="{% url 'ALL_PICS_uploaded' %}" class="a_same">Pictures_model</a><br><br>
      <a href="{% url 'FN_catogries' %}" class="a_same">FN_catogri</a>
      <a href="{% url 'FN_ALL_uploaded' %}" class="a_same">FN_model</a>
      <a href="{% url 'TrandUploaded' %}" class="a_same">Tranding Movies</a>

    </header>
    <div class="container">
      <form action="" method="post" class="form_designe" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="" style="color: white;">Papular image</label><br>
        <input type="file" name="Papular_image" required id="" class="same"><br><br>

        <label for="" style="color: white;">Papular image Title</label><br>
        <input type="text" name="Papular_image_Title" id="" required class="same"
          placeholder="Enter papular picture name..."><br><br>

        <button class="btn">Submit</button>
      </form>


      <!-- show papular image -->
      <div class="PImageShoW">
        {% for t in getALL_pictures%}
        <div class="container_P_show">
          <div class="picdiv same2"><img src="{{t.Papular_image.url}}" alt="not" width="100%"></div>
          <div class="Name2 same2">{{t.Papular_image_Title}}</div>
          <a href="{% url 'Delete_Pic_uploaded_data' t.id %}"><button type="button"
              class="btn_delete">Delete</button></a>
        </div>
        {% empty %}
        not founded...
        {% endfor %}

      </div><br><br>

    </div>
  </body>

</html>
